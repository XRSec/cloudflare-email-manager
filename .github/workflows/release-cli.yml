name: Release cem CLI

on:
  push:
    tags:
      - 'cli-v*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run CLI and shared verification unit tests
        run: |
          node --test cli/specs/*.test.ts
          node --test worker/specs/verificationCode.test.ts

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            artifact: cem-darwin-arm64
            os: ubuntu-latest
          - target: bun-darwin-x64
            artifact: cem-darwin-x64
            os: ubuntu-latest
          - target: bun-linux-x64
            artifact: cem-linux-x64
            os: ubuntu-latest
          - target: bun-linux-arm64
            artifact: cem-linux-arm64
            os: ubuntu-latest
          - target: bun-windows-x64
            artifact: cem-windows-x64.exe
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Compile single-file binary (${{ matrix.target }})
        run: |
          mkdir -p dist
          bun build cli/src/index.ts --compile --target=${{ matrix.target }} --outfile dist/${{ matrix.artifact }}
          sha256sum dist/${{ matrix.artifact }} > dist/${{ matrix.artifact }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
