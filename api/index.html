<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloudflare 临时邮箱管理系统 API 文档</title>
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui.css" />
  <style>
    html {
      box-sizing: border-box;
      overflow: -moz-scrollbars-vertical;
      overflow-y: scroll;
    }

    *,
    *:before,
    *:after {
      box-sizing: inherit;
    }

    body {
      margin: 0;
      background: #fafafa;
    }

    .swagger-ui .topbar {
      background-color: #1f2937;
    }

    .swagger-ui .topbar .download-url-wrapper {
      display: none;
    }
  </style>
</head>

<body>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function () {
      const ui = SwaggerUIBundle({
        url: './api-doc.yml',
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "StandaloneLayout",
        validatorUrl: null,
        tryItOutEnabled: true,
        supportedSubmitMethods: ['get', 'post', 'put', 'delete', 'patch', 'head', 'options'],
        requestInterceptor: function (request) {
          // 添加 CORS 头
          request.headers['Access-Control-Allow-Origin'] = '*';
          return request;
        },
        onComplete: function () {
          console.log('✅ OpenAPI 文档加载完成');
          console.log('📋 版本:', ui.getSystem().specSelectors.specJson().get('openapi'));
          console.log('📋 标题:', ui.getSystem().specSelectors.specJson().get('info').title);
        },
        onFailure: function (data) {
          console.error('❌ OpenAPI 文档加载失败:', data);
          console.error('请检查 YAML 语法和结构');
        }
      });
    };
  </script>
</body>

</html>
