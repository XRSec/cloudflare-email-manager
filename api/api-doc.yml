openapi: 3.0.3
info:
  title: Cloudflare 邮箱管理系统 API
  version: 3.0.0
  description: |
    Cloudflare Email Manager (CEM) 的统一 API 规范。系统已精简为 **单管理员模式**，不再开放多用户注册与邮箱申请，所有管理操作均由管理员完成。

    - 所有接口前缀统一为 `/api`
    - 统一使用 HttpOnly Cookie 维持会话
    - localStorage 仅缓存 UI 状态，业务数据一律来自接口
    - `allow_registration` 字段在健康检查与系统配置中继续返回，用于未来扩展（当前永远为只读）

servers:
  - url: http://localhost:8787
    description: 开发环境
  - url: https://cem.xrsec.workers.dev
    description: 生产环境

tags:
  - name: Auth
    description: 登录 / 登出
  - name: User
    description: 管理员个人信息维护
  - name: Emails
    description: 邮件收取、查看、删除、附件下载
  - name: ForwardRules
    description: 全局转发与 webhook 管理
  - name: System
    description: 健康检查与系统配置
  - name: Database
    description: 调试模式下的数据库辅助接口

paths:
  /api/auth/login:
    post:
      tags: [Auth]
      summary: 管理员登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: 退出登录
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicResponse'

  /api/users/me:
    get:
      tags: [User]
      summary: 获取管理员信息
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 当前管理员信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
    put:
      tags: [User]
      summary: 更新管理员信息
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettingsUpdate'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicResponse'
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/emails:
    get:
      tags: [Emails]
      summary: 获取邮件列表
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: search
          in: query
          schema: { type: string }
          description: 主题 / 发件人模糊搜索
        - name: status
          in: query
          schema: { type: string, enum: ['unread','read'] }
        - name: scope
          in: query
          schema: { type: string, enum: ['all'] }
          description: 仅管理员可传 `all`
      responses:
        '200':
          description: 邮件列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailListResponse'
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  /api/emails/{id}:
    get:
      tags: [Emails]
      summary: 获取邮件详情
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/EmailIdParam'
      responses:
        '200':
          description: 邮件详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailDetailResponse'
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      tags: [Emails]
      summary: 删除邮件
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/EmailIdParam'
      responses:
        '200': { $ref: '#/components/schemas/BasicResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /api/emails/{id}/attachments/{attachmentId}:
    get:
      tags: [Emails]
      summary: 下载附件
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/EmailIdParam'
        - name: attachmentId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: 附件文件流
          content:
            '*/*': {}
        '404': { $ref: '#/components/responses/NotFoundError' }

  /api/emails/send:
    post:
      tags: [Emails]
      summary: 发送邮件（调试）
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEmailRequest'
      responses:
        '200': { $ref: '#/components/schemas/BasicResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/forward-rules:
    get:
      tags: [ForwardRules]
      summary: 获取转发规则
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: 规则列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForwardRuleListResponse'
        '403': { $ref: '#/components/responses/ForbiddenError' }
    post:
      tags: [ForwardRules]
      summary: 创建转发规则
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForwardRuleInput'
      responses:
        '200': { $ref: '#/components/schemas/ForwardRuleResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/forward-rules/{id}:
    get:
      tags: [ForwardRules]
      summary: 规则详情
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ForwardRuleIdParam'
      responses:
        '200': { $ref: '#/components/schemas/ForwardRuleResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    put:
      tags: [ForwardRules]
      summary: 更新规则
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ForwardRuleIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForwardRuleInput'
      responses:
        '200': { $ref: '#/components/schemas/BasicResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      tags: [ForwardRules]
      summary: 删除规则
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ForwardRuleIdParam'
      responses:
        '200': { $ref: '#/components/schemas/BasicResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /api/system/health:
    get:
      tags: [System]
      summary: 系统健康检查（公开）
      description: 返回数据库 / R2 / KV 状态以及 `allow_registration` 只读标志。
      responses:
        '200':
          description: 健康信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealthResponse'

  /api/system/registration-status:
    get:
      tags: [System]
      summary: 是否允许注册（只读）
      responses:
        '200':
          description: 当前注册策略
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationStatusResponse'

  /api/system/config:
    get:
      tags: [System]
      summary: 获取系统配置
      security:
        - cookieAuth: []
      responses:
        '200': { $ref: '#/components/schemas/SystemConfigResponse' }
    put:
      tags: [System]
      summary: 更新系统配置
      description: 仅管理员可调用；`allow_registration` 为只读，保留未来开关。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemConfigUpdate'
      responses:
        '200': { $ref: '#/components/schemas/BasicResponse' }

  /api/database/info:
    get:
      tags: [Database]
      summary: 获取 SQLite 基础信息
      security:
        - cookieAuth: []
      responses:
        '200': { $ref: '#/components/schemas/DatabaseInfoResponse' }

  /api/database/tables:
    get:
      tags: [Database]
      summary: 查看各表最近数据
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 各数据表结构 / 最新记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseTablesResponse'

  /api/database/stats:
    get:
      tags: [Database]
      summary: 数据库统计
      security:
        - cookieAuth: []
      responses:
        '200': { $ref: '#/components/schemas/DatabaseStatsResponse' }

  /api/database/init:
    post:
      tags: [Database]
      summary: 初始化数据库（危险操作）
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmText:
                  type: string
      responses:
        '200': { $ref: '#/components/schemas/DatabaseInitResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session_cookies

  parameters:
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    LimitParam:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    EmailIdParam:
      name: id
      in: path
      required: true
      schema: { type: string }
    ForwardRuleIdParam:
      name: id
      in: path
      required: true
      schema: { type: integer }

  schemas:
    BasicResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: admin }
        password: { type: string, example: 123456 }

    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/BasicResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                token: { type: string }
                user:
                  $ref: '#/components/schemas/UserProfile'

    UserProfileResponse:
      allOf:
        - $ref: '#/components/schemas/BasicResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        email: { type: string, format: email }
        user_type: { type: integer, enum: [1], description: 固定为管理员 }
        created_at: { type: string }
        updated_at: { type: string }
        settings:
          type: object
          properties:
            webhook_url: { type: string, nullable: true }
            webhook_secret: { type: string, nullable: true }

    UserSettingsUpdate:
      type: object
      properties:
        password: { type: string, minLength: 6 }
        webhook_url: { type: string }
        webhook_secret: { type: string }

    EmailListResponse:
      allOf:
        - $ref: '#/components/schemas/BasicResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                total: { type: integer }
                items:
                  type: array
                  items: { $ref: '#/components/schemas/EmailSummary' }

    EmailSummary:
      type: object
      properties:
        id: { type: string }
        subject: { type: string }
        sender_email: { type: string }
        recipient_email: { type: string }
        received_at: { type: string }
        has_attachments: { type: integer, enum: [0,1] }

    EmailDetailResponse:
      allOf:
        - $ref: '#/components/schemas/BasicResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                id: { type: string }
                subject: { type: string }
                content: { type: string }
                content_type: { type: string }
                attachments:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: integer }
                      filename: { type: string }
                      size_bytes: { type: integer }

    SendEmailRequest:
      type: object
      required: [to, subject, content]
      properties:
        to: { type: string }
        from: { type: string }
        subject: { type: string }
        content: { type: string }
        content_type:
          type: string
          enum: [text, html, markdown]

    ForwardRuleInput:
      type: object
      required: [rule_name, webhook_url]
      properties:
        rule_name: { type: string }
        description: { type: string }
        webhook_url: { type: string }
        webhook_secret: { type: string }
        recipient_filter: { type: string }
        is_enabled: { type: boolean }

    ForwardRuleResponse:
      allOf:
        - $ref: '#/components/schemas/BasicResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                rule: { $ref: '#/components/schemas/ForwardRule' }

    ForwardRuleListResponse:
      allOf:
        - $ref: '#/components/schemas/BasicResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                total: { type: integer }
                items:
                  type: array
                  items: { $ref: '#/components/schemas/ForwardRule' }

    ForwardRule:
      type: object
      properties:
        id: { type: integer }
        rule_name: { type: string }
        description: { type: string }
        webhook_url: { type: string }
        webhook_secret: { type: string }
        recipient_filter: { type: string }
        is_enabled: { type: boolean }
        created_at: { type: string }
        updated_at: { type: string }

    SystemHealthResponse:
      allOf:
        - $ref: '#/components/schemas/BasicResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                health:
                  type: object
                  properties:
                    status: { type: integer }
                    timestamp: { type: string }
                    services:
                      type: object
                      properties:
                        database:
                          type: object
                          properties:
                            status: { type: integer }
                            latency_ms: { type: integer }
                        storage:
                          type: object
                          properties:
                            status: { type: integer }
                            provider: { type: integer }
                        kv:
                          type: object
                          properties:
                            status: { type: integer }
                            provider: { type: integer }
                    config:
                      type: object
                      properties:
                        allow_registration:
                          type: integer
                          description: 只读标志，当前固定为禁止注册
                        debug_mode: { type: integer }

    RegistrationStatusResponse:
      allOf:
        - $ref: '#/components/schemas/BasicResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                allow_registration: { type: integer }

    SystemConfigResponse:
      allOf:
        - $ref: '#/components/schemas/BasicResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                config:
                  type: object
                  additionalProperties: true
                user_role:
                  type: string
                  enum: ['admin']

    SystemConfigUpdate:
      type: object
      properties:
        debug_mode: { type: integer, enum: [0,1] }
        cleanup_days: { type: integer }
        max_attachment_size: { type: integer, description: 单位：字节 }
        cookie_max_age: { type: integer, description: 单位：秒 }
        primary_domain: { type: string }
        admin_email: { type: string }
        domains:
          type: array
          items: { type: string }

    DatabaseInfoResponse:
      allOf:
        - $ref: '#/components/schemas/BasicResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                sqliteVersion: { type: string }
                tables:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      recordCount: { type: integer }
                      error: { type: string }

    DatabaseTablesResponse:
      allOf:
        - $ref: '#/components/schemas/BasicResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                type: object
                properties:
                  table: { type: string }
                  columns:
                    type: array
                    items: { type: string }
                  records:
                    type: array
                    items: { type: object }
                  total: { type: integer }
                  error: { type: string }

    DatabaseStatsResponse:
      allOf:
        - $ref: '#/components/schemas/BasicResponse'
        - type: object
          properties:
            data:
              type: object
              additionalProperties: true

    DatabaseInitResponse:
      allOf:
        - $ref: '#/components/schemas/BasicResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                steps:
                  type: array
                  items: { type: string }

  responses:
    UnauthorizedError:
      description: 未登录或会话失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BasicResponse'
    ForbiddenError:
      description: 权限不足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BasicResponse'
    BadRequest:
      description: 请求参数不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BasicResponse'
    NotFoundError:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BasicResponse'
