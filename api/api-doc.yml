openapi: 3.0.0
info:
  title: 临时邮箱管理系统 API
  description: 基于Cloudflare Workers的临时邮箱管理系统API文档
  version: 1.0.0
  contact:
    name: XRSec
    email: admin@example.com

servers:
  - url: https://your-domain.com
    description: 生产环境
  - url: http://localhost:8787
    description: 开发环境

paths:
  # 认证相关
  /api/register:
    post:
      summary: 用户注册
      tags: [认证]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email_password:
                  type: string
                  minLength: 6
                  description: 邮箱密码
              required: [email_password]
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          description: 系统不允许注册
        '400':
          description: 请求参数错误

  /api/login:
    post:
      summary: 用户登录
      tags: [认证]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email_prefix:
                  type: string
                  description: 邮箱前缀
                email_password:
                  type: string
                  description: 邮箱密码
              required: [email_prefix, email_password]
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: 认证失败

  /api/logout:
    post:
      summary: 用户登出
      tags: [认证]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 登出成功

  # 用户相关
  /api/protected/me:
    get:
      summary: 获取当前用户信息
      tags: [用户]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /api/protected/settings:
    get:
      summary: 获取用户设置
      tags: [用户]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 获取成功
    put:
      summary: 更新用户设置
      tags: [用户]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettingsUpdate'
      responses:
        '200':
          description: 更新成功

  /api/protected/emails:
    get:
      summary: 获取用户邮件列表
      tags: [邮件]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
        - name: sender
          in: query
          schema:
            type: string
        - name: subject
          in: query
          schema:
            type: string
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
        - name: has_attachments
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            default: received_at
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailListResponse'

  /api/protected/emails/{id}:
    get:
      summary: 获取邮件详情
      tags: [邮件]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailDetailResponse'
    delete:
      summary: 删除邮件
      tags: [邮件]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 删除成功

  /api/protected/attachments/{id}/download:
    get:
      summary: 下载附件
      tags: [附件]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 下载成功
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  # 管理员相关
  /api/admin/users:
    get:
      summary: 获取所有用户
      tags: [管理员]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
    post:
      summary: 创建用户
      tags: [管理员]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          description: 创建成功

  /api/admin/users/{id}:
    delete:
      summary: 删除用户
      tags: [管理员]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 删除成功

  /api/admin/users/{id}/send-info:
    post:
      summary: 发送用户信息
      tags: [管理员]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 发送成功

  /api/admin/emails:
    get:
      summary: 获取所有邮件（管理员视图）
      tags: [管理员]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
        - name: sender
          in: query
          schema:
            type: string
        - name: subject
          in: query
          schema:
            type: string
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
        - name: has_attachments
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            default: received_at
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailListResponse'

  /api/admin/emails/{id}:
    delete:
      summary: 删除邮件（管理员）
      tags: [管理员]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 删除成功

  /api/admin/forward-rules:
    get:
      summary: 获取转发规则列表
      tags: [管理员]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForwardRuleListResponse'
    post:
      summary: 创建转发规则
      tags: [管理员]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateForwardRuleRequest'
      responses:
        '200':
          description: 创建成功

  /api/admin/forward-rules/{id}:
    put:
      summary: 更新转发规则
      tags: [管理员]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateForwardRuleRequest'
      responses:
        '200':
          description: 更新成功
    delete:
      summary: 删除转发规则
      tags: [管理员]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 删除成功

  /api/admin/settings:
    get:
      summary: 获取系统设置
      tags: [管理员]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConfigResponse'
    put:
      summary: 更新系统设置
      tags: [管理员]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemConfigUpdate'
      responses:
        '200':
          description: 更新成功

  /api/admin/settings/refresh:
    post:
      summary: 刷新系统设置缓存
      tags: [管理员]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 刷新成功

  # 邮箱管理
  /api/mailbox/user/mailboxes:
    get:
      summary: 获取用户邮箱列表
      tags: [邮箱管理]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailboxListResponse'

  /api/mailbox/user/mailboxes/{id}:
    delete:
      summary: 删除用户邮箱
      tags: [邮箱管理]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 删除成功

  /api/mailbox/user/applications:
    get:
      summary: 获取用户申请记录
      tags: [邮箱管理]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationListResponse'
    post:
      summary: 提交邮箱申请
      tags: [邮箱管理]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        '200':
          description: 申请成功

  /api/mailbox/admin/mailboxes:
    get:
      summary: 获取所有邮箱（管理员）
      tags: [邮箱管理]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailboxListResponse'
    post:
      summary: 创建邮箱（管理员）
      tags: [邮箱管理]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMailboxRequest'
      responses:
        '200':
          description: 创建成功

  /api/mailbox/admin/mailboxes/{id}:
    delete:
      summary: 删除邮箱（管理员）
      tags: [邮箱管理]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 删除成功

  /api/mailbox/admin/applications:
    get:
      summary: 获取所有申请（管理员）
      tags: [邮箱管理]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationListResponse'

  /api/mailbox/admin/applications/{id}/process:
    post:
      summary: 处理申请（管理员）
      tags: [邮箱管理]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessApplicationRequest'
      responses:
        '200':
          description: 处理成功

  # 系统相关
  /api/system/config:
    get:
      summary: 获取系统配置
      tags: [系统]
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConfigResponse'

  # 调试相关
  /api/debug:
    get:
      summary: 获取调试信息
      tags: [调试]
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebugResponse'

  /api/debug/simulate-email:
    post:
      summary: 模拟邮件接收
      tags: [调试]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateEmailRequest'
      responses:
        '200':
          description: 模拟成功

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        error:
          type: string
        data:
          type: object

    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                token:
                  type: string
                user:
                  $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: integer
        email_prefix:
          type: string
        user_type:
          type: string
          enum: [admin, user]
        webhook_url:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/User'

    UserListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                users:
                  type: array
                  items:
                    $ref: '#/components/schemas/User'
                total:
                  type: integer
                page:
                  type: integer
                limit:
                  type: integer
                total_pages:
                  type: integer

    UserSettingsUpdate:
      type: object
      properties:
        email_password:
          type: string
          minLength: 6
        webhook_url:
          type: string
        webhook_secret:
          type: string

    CreateUserRequest:
      type: object
      properties:
        email_prefix:
          type: string
        email_password:
          type: string
          minLength: 6
        user_type:
          type: string
          enum: [admin, user]
          default: user
      required: [email_password]

    Email:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        sender_email:
          type: string
        recipient_email:
          type: string
        subject:
          type: string
        text_content:
          type: string
        html_content:
          type: string
        message_id:
          type: string
        has_attachments:
          type: boolean
        received_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    EmailListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                emails:
                  type: array
                  items:
                    $ref: '#/components/schemas/Email'
                total:
                  type: integer
                page:
                  type: integer
                limit:
                  type: integer
                total_pages:
                  type: integer

    EmailDetailResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Email'
                - type: object
                  properties:
                    attachments:
                      type: array
                      items:
                        $ref: '#/components/schemas/Attachment'

    Attachment:
      type: object
      properties:
        id:
          type: integer
        email_id:
          type: integer
        filename:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
        r2_key:
          type: string
        created_at:
          type: string
          format: date-time

    ForwardRule:
      type: object
      properties:
        id:
          type: integer
        rule_name:
          type: string
        sender_filter:
          type: string
        keyword_filter:
          type: string
        recipient_filter:
          type: string
        webhook_url:
          type: string
        webhook_type:
          type: string
          enum: [dingtalk, feishu, custom]
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ForwardRuleListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                rules:
                  type: array
                  items:
                    $ref: '#/components/schemas/ForwardRule'

    CreateForwardRuleRequest:
      type: object
      properties:
        rule_name:
          type: string
        sender_filter:
          type: string
        keyword_filter:
          type: string
        recipient_filter:
          type: string
        webhook_url:
          type: string
        webhook_type:
          type: string
          enum: [dingtalk, feishu, custom]
          default: custom
        enabled:
          type: boolean
          default: true
      required: [rule_name, webhook_url]

    UpdateForwardRuleRequest:
      type: object
      properties:
        rule_name:
          type: string
        sender_filter:
          type: string
        keyword_filter:
          type: string
        recipient_filter:
          type: string
        webhook_url:
          type: string
        webhook_type:
          type: string
          enum: [dingtalk, feishu, custom]
        enabled:
          type: boolean

    SystemConfig:
      type: object
      properties:
        allow_registration:
          type: boolean
        debug_mode:
          type: boolean
        cleanup_days:
          type: integer
        max_attachment_size:
          type: integer
        domains:
          type: array
          items:
            type: string
        jwt_secret:
          type: string
        admin_email:
          type: string

    SystemConfigResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                config:
                  $ref: '#/components/schemas/SystemConfig'

    SystemConfigUpdate:
      type: object
      properties:
        allow_registration:
          type: boolean
        debug_mode:
          type: boolean
        cleanup_days:
          type: integer
          minimum: 1
          maximum: 365
        max_attachment_size:
          type: integer
          minimum: 1024
        domains:
          type: array
          items:
            type: string
        jwt_secret:
          type: string
        admin_email:
          type: string
          format: email

    Mailbox:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        email_address:
          type: string
        is_default:
          type: boolean
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    MailboxListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                mailboxes:
                  type: array
                  items:
                    $ref: '#/components/schemas/Mailbox'

    CreateMailboxRequest:
      type: object
      properties:
        user_id:
          type: integer
        email_address:
          type: string
          format: email
      required: [user_id, email_address]

    Application:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        email_address:
          type: string
        reason:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        admin_comment:
          type: string
        applied_at:
          type: string
          format: date-time
        processed_at:
          type: string
          format: date-time

    ApplicationListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                applications:
                  type: array
                  items:
                    $ref: '#/components/schemas/Application'

    CreateApplicationRequest:
      type: object
      properties:
        email_address:
          type: string
          format: email
        reason:
          type: string
      required: [email_address]

    ProcessApplicationRequest:
      type: object
      properties:
        action:
          type: string
          enum: [approve, reject]
        admin_comment:
          type: string
      required: [action]

    DebugResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                message:
                  type: string
                timestamp:
                  type: string
                  format: date-time
                environment:
                  type: object

    SimulateEmailRequest:
      type: object
      properties:
        from:
          type: string
          format: email
        to:
          type: string
          format: email
        subject:
          type: string
        text:
          type: string
        html:
          type: string
      required: [from, to]

tags:
