    SystemConfig:
      type: object
      properties:
        debug_mode:
          type: integer
          description: 调试模式状态 (1=开启, 0=关闭)
          default: 0
        allow_registration:
          type: integer
          description: 是否允许新用户注册 (1=是, 0=否)
          default: 1
