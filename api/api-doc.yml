openapi: 3.0.3
info:
  title: Cloudflare 邮箱管理系统 API
  version: 4.0.0
  description: |
    Cloudflare Email Manager (CEM) 的统一 API 规范。

    **单管理员模式：**
    - 系统中只有一个管理员用户
    - 用户只能修改自己的用户名和密码
    - 所有邮件不绑定用户，直接管理
    - 不支持用户注册、邮箱管理等功能

    **技术说明：**
    - 所有接口前缀统一为 `/api`
    - 统一使用 HttpOnly Cookie 维持会话
    - localStorage 仅缓存 UI 状态，业务数据一律来自接口
    - `user_id` 字段仅用于 JWT 认证，业务逻辑中不使用
    - `user_type` 字段在数据库中保留但不使用

servers:
  - url: http://localhost:8787
    description: 开发环境
  - url: https://cem.xrsec.workers.dev
    description: 生产环境

tags:
  - name: Auth
    description: 用户登录和登出
  - name: User
    description: 用户信息查询和修改（用户名、密码）
  - name: Emails
    description: 邮件接收、查看、删除、附件下载
  - name: System
    description: 健康检查与系统配置管理
  - name: Dashboard
    description: 仪表板统计数据和转发日志管理
  - name: Database
    description: 调试模式下的数据库管理接口

paths:
  /api/auth/login:
    post:
      tags: [Auth]
      summary: 用户登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: 退出登录
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicResponse'

  /api/users/me:
    get:
      tags: [User]
      summary: 获取当前用户信息
      description: 返回当前登录用户的基本信息（id、用户名、创建时间、更新时间）
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 当前用户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
    put:
      tags: [User]
      summary: 更新用户信息
      description: |
        更新当前用户的信息，支持：
        - 修改用户名（3-50个字符）
        - 修改密码（至少6位，需要二次确认）
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettingsUpdate'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicResponse'
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/emails:
    get:
      tags: [Emails]
      summary: 获取邮件列表
      description: 单管理员模式，返回系统中所有邮件
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: search
          in: query
          schema: { type: string }
          description: 主题 / 发件人 / 收件人模糊搜索
        - name: status
          in: query
          schema: { type: string, enum: ['unread','read'] }
          description: 邮件状态筛选
      responses:
        '200':
          description: 邮件列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailListResponse'
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  /api/emails/{id}:
    get:
      tags: [Emails]
      summary: 获取邮件详情
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/EmailIdParam'
      responses:
        '200':
          description: 邮件详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailDetailResponse'
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      tags: [Emails]
      summary: 删除邮件
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/EmailIdParam'
      responses:
        '200': { $ref: '#/components/schemas/BasicResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /api/emails/batch/read-status:
    patch:
      tags: [Emails]
      summary: 批量更新邮件已读状态
      description: 一次性更新多封邮件的已读/未读状态
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emailIds, is_read]
              properties:
                emailIds:
                  type: array
                  items: { type: string }
                  description: 邮件ID数组（UUID）
                is_read:
                  type: boolean
                  description: true=已读, false=未读
      responses:
        '200':
          description: 批量更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicResponse'
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/emails/batch:
    delete:
      tags: [Emails]
      summary: 批量删除邮件
      description: 一次性删除多封邮件及其附件
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emailIds]
              properties:
                emailIds:
                  type: array
                  items: { type: string }
                  description: 邮件ID数组（UUID）
      responses:
        '200':
          description: 批量删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicResponse'
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/emails/{id}/read-status:
    patch:
      tags: [Emails]
      summary: 更新邮件已读状态
      description: 标记单封邮件为已读或未读
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/EmailIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_read]
              properties:
                is_read:
                  type: boolean
                  description: true=已读, false=未读
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicResponse'
        '404': { $ref: '#/components/responses/NotFoundError' }

  /api/emails/{id}/raw:
    get:
      tags: [Emails]
      summary: 下载原始邮件（.eml 格式，支持 HTTP 缓存）
      description: |
        获取邮件的原始 RFC 822 格式内容，支持完整的 HTTP 缓存机制：
        - 返回剔除附件后的完整邮件（包含邮件头和正文）
        - **ETag**: 基于邮件 ID 和更新时间生成
        - **Last-Modified**: 邮件的最后修改时间
        - **Cache-Control**: public, max-age=31536000, immutable（缓存 1 年）
        - **304 Not Modified**: 当客户端缓存有效时返回
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/EmailIdParam'
        - name: If-None-Match
          in: header
          required: false
          description: ETag 值，用于条件请求
          schema: { type: string }
        - name: If-Modified-Since
          in: header
          required: false
          description: 最后修改时间，用于条件请求
          schema: { type: string }
      responses:
        '200':
          description: 原始邮件内容（RFC 822 格式）
          headers:
            ETag:
              description: 邮件的 ETag 标识
              schema: { type: string }
            Last-Modified:
              description: 邮件的最后修改时间
              schema: { type: string }
            Cache-Control:
              description: 缓存策略
              schema: { type: string }
              example: 'public, max-age=31536000, immutable'
          content:
            message/rfc822:
              schema:
                type: string
                format: binary
        '304':
          description: Not Modified（缓存仍然有效）
          headers:
            ETag:
              schema: { type: string }
            Last-Modified:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /api/emails/{id}/attachments/{attachmentId}:
    get:
      tags: [Emails]
      summary: 下载附件（支持 HTTP 缓存）
      description: |
        下载邮件附件，支持完整的 HTTP 缓存机制：
        - **ETag**: 基于附件 ID 和更新时间生成
        - **Last-Modified**: 附件的最后修改时间
        - **Cache-Control**: public, max-age=31536000, immutable（缓存 1 年）
        - **304 Not Modified**: 当客户端缓存有效时返回
        
        **条件请求支持**：
        - 客户端可发送 `If-None-Match` 头（ETag 值）
        - 客户端可发送 `If-Modified-Since` 头（时间戳）
        - 如果缓存有效，服务器返回 304，无响应体
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/EmailIdParam'
        - name: attachmentId
          in: path
          required: true
          schema: { type: string }
          description: 附件ID（UUID）
        - name: If-None-Match
          in: header
          required: false
          description: ETag 值，用于条件请求
          schema: { type: string }
          example: '"abc123"'
        - name: If-Modified-Since
          in: header
          required: false
          description: 最后修改时间，用于条件请求
          schema: { type: string }
          example: 'Sun, 30 Nov 2025 12:00:00 GMT'
      responses:
        '200':
          description: 附件文件流（首次请求或缓存失效）
          headers:
            ETag:
              description: 附件的 ETag 标识
              schema: { type: string }
              example: '"abc123"'
            Last-Modified:
              description: 附件的最后修改时间
              schema: { type: string }
              example: 'Sun, 30 Nov 2025 12:00:00 GMT'
            Cache-Control:
              description: 缓存策略
              schema: { type: string }
              example: 'public, max-age=31536000, immutable'
            Vary:
              description: 缓存隔离策略
              schema: { type: string }
              example: 'Authorization'
          content:
            '*/*': {}
        '304':
          description: Not Modified（缓存仍然有效）
          headers:
            ETag:
              description: 附件的 ETag 标识
              schema: { type: string }
            Last-Modified:
              description: 附件的最后修改时间
              schema: { type: string }
            Cache-Control:
              description: 缓存策略
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /api/attachments/{attachmentId}:
    get:
      tags: [Emails]
      summary: 下载附件（简洁路径）
      description: |
        通过附件ID直接下载附件，无需提供邮件ID。
        自动查询关联的邮件并检查权限。
        支持完整的 HTTP 缓存机制（同 /api/emails/{id}/attachments/{attachmentId}）
      security:
        - cookieAuth: []
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema: { type: string }
          description: 附件ID（UUID）
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
        - name: If-Modified-Since
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: 附件文件流
          content:
            '*/*': {}
        '304':
          description: Not Modified（缓存仍然有效）
        '404': { $ref: '#/components/responses/NotFoundError' }

  /api/emails/send:
    post:
      tags: [Emails]
      summary: 发送邮件（调试）
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEmailRequest'
      responses:
        '200': { $ref: '#/components/schemas/BasicResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/system/health:
    get:
      tags: [System]
      summary: 系统健康检查（公开）
      description: 返回数据库 / R2 / KV 状态以及 `allow_registration` 只读标志。
      responses:
        '200':
          description: 健康信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealthResponse'

  /api/system/registration-status:
    get:
      tags: [System]
      summary: 是否允许注册（只读）
      responses:
        '200':
          description: 当前注册策略
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationStatusResponse'

  /api/system/config:
    get:
      tags: [System]
      summary: 获取系统配置
      security:
        - cookieAuth: []
      responses:
        '200': { $ref: '#/components/schemas/SystemConfigResponse' }
    put:
      tags: [System]
      summary: 更新系统配置
      description: `allow_registration` 为只读，保留未来开关。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemConfigUpdate'
      responses:
        '200': { $ref: '#/components/schemas/BasicResponse' }

  /api/dashboard/stats:
    get:
      tags: [Dashboard]
      summary: 获取仪表板统计数据
      description: |
        返回仪表板统计数据，包括：
        - 邮件统计（总数、今日、未读）
        - R2 文件数量
        - 转发日志统计（总数、成功、失败）
        - 最近转发日志（最新5条）
        
        支持 KV 缓存，5分钟过期
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 仪表板统计数据
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      stats:
                        type: object
                        properties:
                          email:
                            type: object
                            properties:
                              total: { type: integer, description: 邮件总数 }
                              today: { type: integer, description: 今日邮件数 }
                              unread: { type: integer, description: 未读邮件数 }
                          r2:
                            type: object
                            properties:
                              fileCount: { type: integer, description: R2文件数量 }
                          forward:
                            type: object
                            properties:
                              total: { type: integer, description: 转发日志总数 }
                              success: { type: integer, description: 转发成功数 }
                              failed: { type: integer, description: 转发失败数 }
                              recentLogs:
                                type: array
                                description: 最近5条转发日志
                                items:
                                  type: object
                                  properties:
                                    id: { type: integer }
                                    email_id: { type: string }
                                    webhook_url: { type: string }
                                    status: { type: integer, description: '0=成功, 1=失败' }
                                    response_code: { type: integer }
                                    error_message: { type: string }
                                    sent_at: { type: string, format: date-time }
                                    subject: { type: string }
                                    from_address: { type: string }
                          timestamp: { type: string, format: date-time, description: 统计数据生成时间 }
                      cached: { type: boolean, description: 是否从缓存读取 }
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  /api/dashboard/forward-logs:
    get:
      tags: [Dashboard]
      summary: 获取转发日志列表
      description: 分页查询转发日志，支持按状态筛选
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          schema: { type: integer, enum: [0, 1] }
          description: '转发状态筛选：0=成功, 1=失败'
      responses:
        '200':
          description: 转发日志列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            email_id: { type: string }
                            webhook_url: { type: string }
                            status: { type: integer, description: '0=成功, 1=失败' }
                            response_code: { type: integer }
                            error_message: { type: string }
                            sent_at: { type: string, format: date-time }
                            created_at: { type: string, format: date-time }
                            subject: { type: string, description: 关联邮件主题 }
                            from_address: { type: string, description: 关联邮件发件人 }
                            to_address: { type: string, description: 关联邮件收件人 }
                      total: { type: integer }
                      page: { type: integer }
                      limit: { type: integer }
                      totalPages: { type: integer }
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  /api/dashboard/forward-logs/{id}:
    get:
      tags: [Dashboard]
      summary: 获取转发日志详情
      description: 获取单条转发日志的详细信息，包括关联的邮件内容
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          description: 转发日志ID
      responses:
        '200':
          description: 转发日志详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      log:
                        type: object
                        properties:
                          id: { type: integer }
                          email_id: { type: string }
                          webhook_url: { type: string }
                          status: { type: integer, description: '0=成功, 1=失败' }
                          response_code: { type: integer }
                          error_message: { type: string }
                          sent_at: { type: string, format: date-time }
                          created_at: { type: string, format: date-time }
                          updated_at: { type: string, format: date-time }
                          subject: { type: string, description: 关联邮件主题 }
                          from_address: { type: string, description: 关联邮件发件人 }
                          to_address: { type: string, description: 关联邮件收件人 }
                          content: { type: string, description: 关联邮件内容预览 }
                          received_at: { type: string, format: date-time, description: 邮件接收时间 }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  /api/dashboard/cache:
    delete:
      tags: [Dashboard]
      summary: 清理仪表板缓存
      description: 清理仪表板相关的 KV 缓存数据（邮件数量、R2文件数量、统计数据等）
      security:
        - cookieAuth: []
      responses:
        '200': { $ref: '#/components/schemas/BasicResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  /api/database/info:
    get:
      tags: [Database]
      summary: 获取 SQLite 基础信息
      security:
        - cookieAuth: []
      responses:
        '200': { $ref: '#/components/schemas/DatabaseInfoResponse' }

  /api/database/tables:
    get:
      tags: [Database]
      summary: 查看各表最近数据
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 各数据表结构 / 最新记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseTablesResponse'

  /api/database/stats:
    get:
      tags: [Database]
      summary: 数据库统计
      security:
        - cookieAuth: []
      responses:
        '200': { $ref: '#/components/schemas/DatabaseStatsResponse' }

  /api/database/init:
    post:
      tags: [Database]
      summary: 初始化数据库（危险操作）
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmText:
                  type: string
      responses:
        '200': { $ref: '#/components/schemas/DatabaseInitResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session_cookies

  parameters:
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    LimitParam:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    EmailIdParam:
      name: id
      in: path
      required: true
      schema: { type: string }

  schemas:
    BasicResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: admin }
        password: { type: string, example: 123456 }

    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/BasicResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                token: { type: string }
                user:
                  $ref: '#/components/schemas/UserProfile'

    UserProfileResponse:
      allOf:
        - $ref: '#/components/schemas/BasicResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      properties:
        id: { type: integer, description: "用户ID（预留字段，仅用于JWT认证）" }
        username: { type: string, description: "用户名" }
        created_at: { type: string, description: "创建时间" }
        updated_at: { type: string, description: "更新时间" }

    UserSettingsUpdate:
      type: object
      properties:
        username: 
          type: string
          minLength: 3
          maxLength: 50
          description: 新用户名（可选）
        password: 
          type: string
          minLength: 6
          description: 新密码（可选）
        password_confirm:
          type: string
          minLength: 6
          description: 确认密码（修改密码时必需）

    EmailListResponse:
      allOf:
        - $ref: '#/components/schemas/BasicResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                total: { type: integer }
                items:
                  type: array
                  items: { $ref: '#/components/schemas/EmailSummary' }

    EmailSummary:
      type: object
      properties:
        id: { type: string, description: "邮件ID（UUID）" }
        subject: { type: string, description: "邮件主题" }
        from_address: { type: string, description: "发件人地址" }
        to_address: { type: string, description: "收件人地址" }
        content: { type: string, description: "内容预览" }
        is_read: { type: integer, enum: [0,1], description: "0=未读, 1=已读" }
        attachment_count: { type: integer, description: "附件数量" }
        received_at: { type: string, description: "接收时间" }
        created_at: { type: string, description: "创建时间" }
        updated_at: { type: string, description: "更新时间" }

    EmailDetailResponse:
      allOf:
        - $ref: '#/components/schemas/BasicResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                id: { type: string, description: "邮件ID（UUID）" }
                subject: { type: string, description: "邮件主题" }
                from_address: { type: string, description: "发件人地址" }
                to_address: { type: string, description: "收件人地址" }
                content: { type: string, description: "内容预览" }
                full_content: { type: string, description: "完整内容" }
                full_content_type: { type: string, enum: [text, html], description: "完整内容类型" }
                is_read: { type: integer, enum: [0,1], description: "0=未读, 1=已读" }
                attachment_count: { type: integer, description: "附件数量" }
                received_at: { type: string, description: "接收时间" }
                attachments:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string, description: "附件ID（UUID）" }
                      filename: { type: string, description: "文件名" }
                      content_type: { type: string, description: "MIME类型" }
                      size_bytes: { type: integer, description: "文件大小（字节）" }
                      url: { type: string, description: "附件访问URL" }

    SendEmailRequest:
      type: object
      required: [to, subject, content]
      properties:
        to: { type: string }
        from: { type: string }
        subject: { type: string }
        content: { type: string }
        content_type:
          type: string
          enum: [text, html, markdown]

    SystemHealthResponse:
      allOf:
        - $ref: '#/components/schemas/BasicResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                health:
                  type: object
                  properties:
                    status: { type: integer }
                    timestamp: { type: string }
                    services:
                      type: object
                      properties:
                        database:
                          type: object
                          properties:
                            status: { type: integer }
                            latency_ms: { type: integer }
                        storage:
                          type: object
                          properties:
                            status: { type: integer }
                            provider: { type: integer }
                        kv:
                          type: object
                          properties:
                            status: { type: integer }
                            provider: { type: integer }
                    config:
                      type: object
                      properties:
                        allow_registration:
                          type: integer
                          description: 只读标志，当前固定为禁止注册
                        debug_mode: { type: integer }

    RegistrationStatusResponse:
      allOf:
        - $ref: '#/components/schemas/BasicResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                allow_registration: { type: integer }

    SystemConfigResponse:
      allOf:
        - $ref: '#/components/schemas/BasicResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                config:
                  type: object
                  additionalProperties: true

    SystemConfigUpdate:
      type: object
      properties:
        debug_mode: { type: integer, enum: [0,1] }
        mail_retention_days: { type: integer, description: 邮件保留天数 }
        attachment_retention_days: { type: integer, description: 附件保留天数 }
        max_attachment_size: { type: integer, description: 单位：字节 }
        cookie_max_age: { type: integer, description: 单位：秒 }
        primary_domain: { type: string }
        admin_email: { type: string }
        domains:
          type: array
          items: { type: string }
        default_webhook_url: { type: string, description: 默认 Webhook URL（系统级别，所有邮件都会发送到此 webhook，如果为空则不通知） }
        default_webhook_secret: { type: string, description: 默认 Webhook 密钥（可选） }
        default_webhook_type: { type: string, enum: [dingtalk, feishu, bark, custom], description: 默认 Webhook 类型 }

    DatabaseInfoResponse:
      allOf:
        - $ref: '#/components/schemas/BasicResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                sqliteVersion: { type: string }
                tables:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      recordCount: { type: integer }
                      error: { type: string }

    DatabaseTablesResponse:
      allOf:
        - $ref: '#/components/schemas/BasicResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                type: object
                properties:
                  table: { type: string }
                  columns:
                    type: array
                    items: { type: string }
                  records:
                    type: array
                    items: { type: object }
                  total: { type: integer }
                  error: { type: string }

    DatabaseStatsResponse:
      allOf:
        - $ref: '#/components/schemas/BasicResponse'
        - type: object
          properties:
            data:
              type: object
              additionalProperties: true

    DatabaseInitResponse:
      allOf:
        - $ref: '#/components/schemas/BasicResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                steps:
                  type: array
                  items: { type: string }

  responses:
    UnauthorizedError:
      description: 未登录或会话失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BasicResponse'
    ForbiddenError:
      description: 权限不足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BasicResponse'
    BadRequest:
      description: 请求参数不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BasicResponse'
    NotFoundError:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BasicResponse'
