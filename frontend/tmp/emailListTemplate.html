<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>邮件列表</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 8px;
    }

    th {
      background: #f4f4f4;
      text-align: left;
    }

    tr:nth-child(even) {
      background: #f9f9f9;
    }
  </style>
</head>

<body>
  <h1>📬 邮件列表 ({{count}} 封)</h1>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>From</th>
        <th>To</th>
        <th>大小</th>
        <th>时间</th>
      </tr>
    </thead>
    <tbody>{{rows}}</tbody>
  </table>
  <p><a href="/">返回首页</a></p>
</body>

</html>
